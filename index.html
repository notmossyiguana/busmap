<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BBIS Campus Routes</title>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; display: flex; height: 100vh; color: #1a1a1a; }
    aside { width: 340px; padding: 20px; background: #fff; border-right: 1px solid #ddd; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; box-shadow: 2px 0 8px rgba(0,0,0,0.05); z-index: 1000; }
    #map { flex: 1; height: 100%; z-index: 1; }
    h1 { font-size: 1.2rem; margin: 0; font-weight: 700; color: #2d3748; }
    .input-group { display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 0.85rem; color: #4a5568; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    input[type=text] { padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 0.95rem; outline: none; transition: border 0.2s; }
    input[type=text]:focus { border-color: #3182ce; }
    button { padding: 10px; background: #3182ce; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #2b6cb0; }
    .card { background: #f7fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 0.9rem; line-height: 1.4; }
    .card b { color: #2d3748; display: block; margin-bottom: 4px; font-size: 1rem; }
    .transit-links { display: flex; gap: 8px; margin-top: 10px; }
    .transit-links a { flex: 1; text-align: center; padding: 6px; background: #edf2f7; color: #2d3748; text-decoration: none; border-radius: 4px; font-size: 0.8rem; font-weight: 600; border: 1px solid #cbd5e0; }
    .transit-links a:hover { background: #e2e8f0; }
    .route-item { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; padding: 6px 0; border-bottom: 1px solid #f0f0f0; }
    .badge { width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  </style>
</head>
<body>

<aside>
  <div>
    <h1>Berlin Brandenburg International School</h1>
    <p style="font-size:0.85rem; color:#718096; margin:4px 0 0 0;">Schopfheimer Allee 10, Kleinmachnow</p>
  </div>

  <div class="input-group">
    <label for="q">Get Directions & Transit</label>
    <input type="text" id="q" placeholder="Enter starting address..." />
    <button id="btn-search">Calculate Route</button>
  </div>

  <div id="results"></div>

  <div>
    <label>Active School Bus Routes</label>
    <div id="route-list"></div>
  </div>
</aside>

<div id="map"></div>

<script>
  // Exact BBIS location
  const BBIS_CAMPUS = { name: "Berlin Brandenburg International School", lat: 52.3951, lon: 13.2036 };

  // Sample of bus routes (Simplified for brevity, format supports any length)
  const BUS_DATA = [
    {
      id: "bus3", name: "Bus 3: Babelsberg", color: "#319795",
      stops: [
        { name: "Hiroshima-Nagasaki-Platz", lat: 52.3931, lon: 13.1281 },
        { name: "S-Bhf Griebnitzsee", lat: 52.3946, lon: 13.1287 },
        { name: "Stahnsdorf, Heinrich-Zille-Str.", lat: 52.3914, lon: 13.2201 },
        { name: BBIS_CAMPUS.name, lat: BBIS_CAMPUS.lat, lon: BBIS_CAMPUS.lon }
      ]
    },
    {
      id: "bus10", name: "Bus 10: Lichterfelde", color: "#2b6cb0",
      stops: [
        { name: "S Lichterfelde Ost", lat: 52.4302, lon: 13.3282 },
        { name: "Wismarer Str.", lat: 52.4172, lon: 13.3201 },
        { name: "Teltow, Ruhlsdorfer Platz", lat: 52.4011, lon: 13.2621 },
        { name: BBIS_CAMPUS.name, lat: BBIS_CAMPUS.lat, lon: BBIS_CAMPUS.lon }
      ]
    }
  ];

  // Init Map with a modern, high-quality, free basemap (CartoDB Voyager)
  const map = L.map('map').setView([BBIS_CAMPUS.lat, BBIS_CAMPUS.lon], 12);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> | &copy; <a href="https://carto.com/">CARTO</a>'
  }).addTo(map);

  // Add Campus Marker
  L.marker([BBIS_CAMPUS.lat, BBIS_CAMPUS.lon]).addTo(map)
    .bindPopup(`<b>${BBIS_CAMPUS.name}</b><br>Schopfheimer Allee 10`).openPopup();

  let userMarker = null;
  let userRouteLayer = null;

  // 1. Fetch Driving Roads via Free OSRM API for the Bus Routes
  async function drawRoadRoutes() {
    const listEl = document.getElementById('route-list');
    
    for (const route of BUS_DATA) {
      // Sidebar UI
      const item = document.createElement('div');
      item.className = 'route-item';
      item.innerHTML = `<span class="badge" style="background:${route.color}"></span><span>${route.name}</span>`;
      listEl.appendChild(item);

      // Add Pins
      route.stops.forEach((stop, i) => {
        if (i === route.stops.length - 1) return; // Skip campus duplicate
        const icon = L.divIcon({
          className: 'custom-icon',
          html: `<div style="width:10px;height:10px;background:${route.color};border:2px solid #fff;border-radius:50%;"></div>`,
          iconSize: [10, 10]
        });
        L.marker([stop.lat, stop.lon], { icon, interactive: false }).addTo(map);
      });

      // API Call for Road Geometry
      const coords = route.stops.map(s => `${s.lon},${s.lat}`).join(';');
      const url = `https://router.project-osrm.org/route/v1/driving/${coords}?geometries=geojson&overview=full`;
      
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.routes && data.routes[0]) {
          const latlngs = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
          L.polyline(latlngs, { color: route.color, weight: 4, opacity: 0.8 }).addTo(map);
        }
      } catch (err) {
        console.error("OSRM Routing failed, falling back to straight lines.", err);
        const fallback = route.stops.map(s => [s.lat, s.lon]);
        L.polyline(fallback, { color: route.color, weight: 4, opacity: 0.8 }).addTo(map);
      }
    }
  }

  // 2. Handle Search, Walking Distance, and Transit Links
  document.getElementById('btn-search').addEventListener('click', async () => {
    const q = document.getElementById('q').value.trim();
    if (!q) return;
    document.getElementById('results').innerHTML = `<p style="font-size:0.85rem; color:#666;">Calculating...</p>`;

    try {
      // Free Geocoding
      const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}`);
      const geoData = await geoRes.json();

      if (geoData && geoData.length > 0) {
        const lat = parseFloat(geoData[0].lat);
        const lon = parseFloat(geoData[0].lon);

        if (userMarker) map.removeLayer(userMarker);
        if (userRouteLayer) map.removeLayer(userRouteLayer);

        userMarker = L.marker([lat, lon]).addTo(map).bindPopup("Start Location").openPopup();
        
        // Free Walking Directions via OSRM
        const walkUrl = `https://router.project-osrm.org/route/v1/foot/${lon},${lat};${BBIS_CAMPUS.lon},${BBIS_CAMPUS.lat}?geometries=geojson&overview=full`;
        const walkRes = await fetch(walkUrl);
        const walkData = await walkRes.json();

        let walkInfo = "Walking route unavailable.";
        if (walkData.routes && walkData.routes[0]) {
          const route = walkData.routes[0];
          const distKm = (route.distance / 1000).toFixed(1);
          const timeMin = Math.round(route.duration / 60);
          walkInfo = `<b>Walking:</b> ${distKm} km (~${timeMin} mins)`;
          
          const latlngs = route.geometry.coordinates.map(c => [c[1], c[0]]);
          userRouteLayer = L.polyline(latlngs, { color: '#000', weight: 4, dashArray: '5, 8' }).addTo(map);
          map.fitBounds(userRouteLayer.getBounds(), { padding: [30, 30] });
        }

        // Generate Universal Transit Deep Links
        const gMapsLink = `https://www.google.com/maps/dir/?api=1&origin=${lat},${lon}&destination=${BBIS_CAMPUS.lat},${BBIS_CAMPUS.lon}&travelmode=transit`;
        const appleLink = `http://maps.apple.com/?saddr=${lat},${lon}&daddr=${BBIS_CAMPUS.lat},${BBIS_CAMPUS.lon}&dirflg=r`;
        const bvgLink = `https://www.bvg.de/de/verbindungen/verbindungssuche?start=${lat},${lon}&ziel=${BBIS_CAMPUS.lat},${BBIS_CAMPUS.lon}`;

        document.getElementById('results').innerHTML = `
          <div class="card">
            <b>Your Route to BBIS</b>
            <span style="color:#4a5568;">${walkInfo}</span>
            <div style="margin-top: 10px; font-weight: bold; font-size: 0.85rem;">Live Transit Options:</div>
            <div class="transit-links">
              <a href="${gMapsLink}" target="_blank">Google</a>
              <a href="${appleLink}" target="_blank">Apple</a>
              <a href="${bvgLink}" target="_blank">BVG (Local)</a>
            </div>
          </div>
        `;
      } else {
        document.getElementById('results').innerHTML = `<p style="color:red; font-size:0.85rem;">Location not found.</p>`;
      }
    } catch (err) {
      document.getElementById('results').innerHTML = `<p style="color:red; font-size:0.85rem;">Error calculating route.</p>`;
    }
  });

  // Load the bus road routing on startup
  drawRoadRoutes();
</script>
</body>
</html>
