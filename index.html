  async function drawRoadRoutes() {
    const listEl = document.getElementById('route-list');
    
    for (const route of BUS_DATA) {
      const item = document.createElement('div');
      item.className = 'route-item';
      item.innerHTML = `<span class="badge" style="background:${route.color}"></span><span>${route.name}</span>`;
      listEl.appendChild(item);

      // Filter out empty placeholder coords to prevent map errors
      const validStops = route.stops.filter(s => s.lat !== 0.0 && s.lon !== 0.0);

      validStops.forEach((stop, i) => {
        if (i === validStops.length - 1) return;
        const icon = L.divIcon({
          className: 'custom-icon',
          html: `<div style="width:10px;height:10px;background:${route.color};border:2px solid #fff;border-radius:50%;"></div>`,
          iconSize: [10, 10]
        });
        L.marker([stop.lat, stop.lon], { icon, interactive: false }).addTo(map);
      });

      if (validStops.length < 2) continue;

      const coords = validStops.map(s => `${s.lon},${s.lat}`).join(';');
      
      // Fallback routing if you want to implement your API_KEY mapping logic later
      const url = `https://router.project-osrm.org/route/v1/driving/${coords}?geometries=geojson&overview=full`;
      
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.routes && data.routes[0]) {
          const latlngs = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
          L.polyline(latlngs, { color: route.color, weight: 4, opacity: 0.8 }).addTo(map);
        }
      } catch (err) {
        const fallback = validStops.map(s => [s.lat, s.lon]);
        L.polyline(fallback, { color: route.color, weight: 4, opacity: 0.8 }).addTo(map);
      }
    }
  }

  document.getElementById('btn-search').addEventListener('click', async () => {
    const q = document.getElementById('q').value.trim();
    if (!q) return;
    document.getElementById('results').innerHTML = `<p style="font-size:0.85rem; color:#666;">Calculating...</p>`;

    try {
      const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}`);
      const geoData = await geoRes.json();

      if (geoData && geoData.length > 0) {
        const lat = parseFloat(geoData[0].lat);
        const lon = parseFloat(geoData[0].lon);

        const walkUrl = `https://router.project-osrm.org/route/v1/foot/${lon},${lat};${BBIS_CAMPUS.lon},${BBIS_CAMPUS.lat}?geometries=geojson&overview=full`;
        const walkRes = await fetch(walkUrl);
        const walkData = await walkRes.json();

        let walkInfo = "Walking route unavailable.";
        if (walkData.routes && walkData.routes[0]) {
          const route = walkData.routes[0];
          walkInfo = `<b>Walking:</b> ${(route.distance / 1000).toFixed(1)} km (~${Math.round(route.duration / 60)} mins)`;
        }

        const gMapsLink = `https://www.google.com/maps/dir/?api=1&origin=${lat},${lon}&destination=${BBIS_CAMPUS.lat},${BBIS_CAMPUS.lon}&travelmode=transit`;
        const appleLink = `http://maps.apple.com/?saddr=${lat},${lon}&daddr=${BBIS_CAMPUS.lat},${BBIS_CAMPUS.lon}&dirflg=r`;
        
        document.getElementById('results').innerHTML = `
          <div class="card">
            <b>Your Route to BBIS</b>
            <span style="color:#4a5568;">${walkInfo}</span>
            <div style="margin-top: 10px; font-weight: bold; font-size: 0.85rem;">Live Transit Options:</div>
            <div class="transit-links">
              <a href="${gMapsLink}" target="_blank">Google</a>
              <a href="${appleLink}" target="_blank">Apple</a>
            </div>
          </div>
        `;
      }
    } catch (err) {}
