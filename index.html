      id: "bus10", name: "Bus 10 (Van): Lichterfelde Ost – Teltow", color: "#2b6cb0",
      stops: [
        { name: "Kaiser-Wilhelm-Str.", pickup: "07:10", drop: "15:40", lat: 52.4352, lon: 13.3321 },
        { name: "S Lichterfelde Ost", pickup: "07:12", drop: "15:34", lat: 52.4302, lon: 13.3282 },
        { name: "Wismarer Str.", pickup: "07:20", drop: "15:28", lat: 52.4172, lon: 13.3201 },
        { name: "Teltow, Hannemannstr.", pickup: "07:30", drop: "15:20", lat: 52.4042, lon: 13.2681 },
        { name: "Teltow, Ruhlsdorfer Platz", pickup: "07:35", drop: "15:15", lat: 52.4011, lon: 13.2621 },
        { name: BBIS_CAMPUS.name, pickup: "07:50", drop: "15:00", lat: BBIS_CAMPUS.lat, lon: BBIS_CAMPUS.lon }
      ]
    }
  ];

  // Initialize Map
  const map = L.map('map').setView([BBIS_CAMPUS.lat, BBIS_CAMPUS.lon], 11);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  let userMarker = null;

  // Render Routes and Fixed Stops
  function renderAll() {
    const listEl = document.getElementById('route-list');
    listEl.innerHTML = '';

    BUS_DATA.forEach(route => {
      // Add Sidebar Label
      const item = document.createElement('div');
      item.className = 'route-item';
      item.innerHTML = `<span class="badge" style="background:${route.color}"></span><span>${route.name}</span>`;
      listEl.appendChild(item);

      // Simple Straight Line Default fallback
      const latLngs = route.stops.map(s => [s.lat, s.lon]);
      const polyline = L.polyline(latLngs, { color: route.color, weight: 3, opacity: 0.8 }).addTo(map);
      route.polyline = polyline;

      // Add Fixed Non-Draggable Stop Markers
      route.stops.forEach((stop, i) => {
        const isCampus = (i === route.stops.length - 1);
        const icon = L.divIcon({
          className: 'custom-icon',
          html: `<div style="width:${isCampus ? 14 : 10}px;height:${isCampus ? 14 : 10}px;background:${isCampus ? '#000' : route.color};border:2px solid #fff;border-radius:50%;"></div>`,
          iconSize: [14, 14],
          iconAnchor: [7, 7]
        });

        L.marker([stop.lat, stop.lon], { icon: icon, interactive: true })
          .addTo(map)
          .bindPopup(`
            <b>${stop.name}</b><br>
            <small>${route.name}</small><br>
            <b>Pickup:</b> ${stop.pickup} | <b>Drop:</b> ${stop.drop}
          `);
      });
    });
  }

  // Fetch Road Geometry using Mapbox Directions API
  async function loadMapboxRoutes(token) {
    for (const route of BUS_DATA) {
      // Chunk waypoints into batches of max 25 (Mapbox limit)
      const coordsStr = route.stops.map(s => `${s.lon},${s.lat}`).join(';');
      const url = `https://api.mapbox.com/directions/v5/mapbox/driving/${coordsStr}?geometries=geojson&access_token=${token}`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.routes && data.routes[0]) {
          const coordinates = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
          if (route.polyline) map.removeLayer(route.polyline);
          route.polyline = L.polyline(coordinates, { color: route.color, weight: 4, opacity: 0.85 }).addTo(map);
        }
      } catch (e) {
        console.error("Mapbox Route Error:", e);
      }
    }
  }

  // Search Address & Find Nearest Stop
  document.getElementById('btn-search').addEventListener('click', async () => {
    const q = document.getElementById('q').value.trim();
    if (!q) return;

    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}`);
      const data = await res.json();

      if (data && data.length > 0) {
        const lat = parseFloat(data[0].lat);
        const lon = parseFloat(data[0].lon);

        map.setView([lat, lon], 13);

        if (userMarker) map.removeLayer(userMarker);
        userMarker = L.marker([lat, lon]).addTo(map).bindPopup(`<b>Location:</b> ${data[0].display_name.split(',')[0]}`).openPopup();

        // Find nearest stop algorithm
        let closest = null;
        let minDistance = Infinity;
        let closestRoute = null;

        BUS_DATA.forEach(route => {
          route.stops.forEach(stop => {
            const dist = map.distance([lat, lon], [stop.lat, stop.lon]);
            if (dist < minDistance) {
              minDistance = dist;
              closest = stop;
              closestRoute = route;
            }
          });
        });

        if (closest) {
          document.getElementById('results').innerHTML = `
            <div class="card">
              <b>Nearest Stop: ${closest.name}</b>
              <span style="color:#666;">${closestRoute.name}</span><br>
              <span>Pickup: ${closest.pickup} | Drop: ${closest.drop}</span><br>
              <small>~${(minDistance / 1000).toFixed(2)} km away</small>
            </div>
          `;
        }
      } else {
        alert("Location not found.");
      }
    } catch (err) {
      alert("Error finding location.");
    }
  });

  // Load Mapbox Token Button Event
  document.getElementById('btn-route').addEventListener('click', () => {
    const token = document.getElementById('mb-token').value.trim();
    if (token) {
      loadMapboxRoutes(token);
    } else {
      alert("Please enter a valid Mapbox public token.");
    }
  });

  // Init
  renderAll();
</script>
</body>
</html>
